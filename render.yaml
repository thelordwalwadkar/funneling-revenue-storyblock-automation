# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: funnelling-revenue
    runtime: docker
    plan: starter
    healthCheckPath: /api/health/
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WEBHOOK_URL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STORYBLOK_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
